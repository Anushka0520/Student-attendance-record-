<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Student Record Management System</title><link rel='stylesheet' href='style.css'></head><body>
<header><h1>Student Record Management System</h1></header>
<div class='card'>
<h2>Admin Login</h2>
<input id='user' placeholder='Username'>
<input id='pass' type='password' placeholder='Password'>
<button onclick='login()'>Login</button><p id='msg'></p>
</div>
<div class='card' id='dashboard' style='display:none;'>
<h2>Student Registration</h2>
<input id='name' placeholder='Student Name'>
<input id='course' placeholder='Course'>
<input id='attendance' placeholder='Attendance %'>
<input id='marks' placeholder='Marks'>
<button onclick='addStudent()'>Add Student</button>
<h2>Search Student</h2>
<input id='search' placeholder='Search by name' onkeyup='render()'>
<table><thead><tr><th>Name</th><th>Course</th><th>Attendance</th><th>Marks</th><th>Action</th></tr></thead><tbody id='table'></tbody></table>
</div><script src='script.js'></script></body></html>
